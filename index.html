<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Planifica</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14b8a6">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        /* Бирюзовая тема */
        body.theme-teal {
            background: linear-gradient(135deg, #ccfbf1 0%, #f0fdfa 100%);
            color: #1e293b;
        }
        body.theme-teal header { background: #14b8a6; }
        body.theme-teal .date-btn.active { background: #14b8a6; color: white; }
        body.theme-teal #addBtn { background: #14b8a6; }
        body.theme-teal .tab-btn.active { background: #14b8a6; }
        body.theme-teal .category-badge { background: #ccfbf1; color: #0f766e; }
        body.theme-teal .profile-section { background: rgba(255,255,255,0.2); }
        body.theme-teal .settings-btn { background: rgba(255,255,255,0.2); }
        body.theme-teal .stats div { background: white; color: #1e293b; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        body.theme-teal .task-item { background: white; border-radius: 16px; margin-bottom: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        body.theme-teal .modal-content { background: white; }
        body.theme-teal input, body.theme-teal select, body.theme-teal textarea { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 30px; padding: 12px; }
        /* Тёмная тема */
        body.theme-dark {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
        }
        body.theme-dark header { background: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        body.theme-dark .stats div { background: #1e293b; color: #f1f5f9; box-shadow: none; }
        body.theme-dark .task-item { background: #1e293b; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        body.theme-dark .category-badge { background: #334155; color: #14b8a6; }
        body.theme-dark .date-btn.active { background: #14b8a6; color: #0f172a; }
        body.theme-dark .tab-btn.active { background: #14b8a6; color: #0f172a; }
        body.theme-dark .modal-content { background: #1e293b; color: #e2e8f0; }
        body.theme-dark input, body.theme-dark select, body.theme-dark textarea { background: #334155; border-color: #475569; color: #f1f5f9; }
        body.theme-dark .profile-section { background: rgba(255,255,255,0.1); }
        body.theme-dark .settings-btn { background: rgba(255,255,255,0.1); }

        .app-container {
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
            color: white;
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px 5px 8px;
            border-radius: 40px;
            cursor: pointer;
        }
        .profile-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            overflow: hidden;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-name {
            font-size: 0.8rem;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        h1 { font-size: 1.2rem; font-weight: 600; }
        .settings-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stats div {
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .stats div span {
            font-size: 1.3rem;
            display: block;
            font-weight: 800;
        }
        .date-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .date-btn {
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            background: #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .category-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .category-badge {
            background: #ccfbf1;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }
        .category-badge.active {
            background: #14b8a6;
            color: white;
        }
        .add-task-panel {
            margin-bottom: 20px;
        }
        .row-inputs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .row-inputs input, .row-inputs select {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        #addBtn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: #14b8a6;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .task-list {
            margin-top: 20px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            flex-wrap: wrap;
        }
        .task-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #14b8a6;
        }
        .task-title {
            font-size: 1rem;
            font-weight: 500;
            word-break: break-word;
            flex: 1;
        }
        .task-completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task-priority {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 30px;
            background: #e2e8f0;
        }
        .task-right {
            display: flex;
            gap: 8px;
        }
        .task-edit, .task-delete {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 30px;
        }
        .empty {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }
        .version {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 30px;
            opacity: 0.5;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            width: 90%;
            max-width: 500px;
            padding: 24px;
            border-radius: 32px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .theme-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
        }
        .theme-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .theme-teal-bg { background: #14b8a6; }
        .theme-dark-bg { background: #1e293b; border: 1px solid #475569; }
        .theme-option.active { border-color: #fff; box-shadow: 0 0 0 2px #14b8a6; }
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body class="theme-teal">
<div class="app-container">
    <header>
        <div class="profile-section" id="profileBtn">
            <div class="profile-avatar" id="headerAvatar">😎</div>
            <span class="profile-name" id="headerName">Гость</span>
        </div>
        <h1>Planifica</h1>
        <div class="settings-btn" id="settingsBtn">⚙️</div>
    </header>

    <div class="stats">
        <div>📋 Всего<br><span id="totalCount">0</span></div>
        <div>⚙️ В процессе<br><span id="activeCount">0</span></div>
        <div>✅ Выполнено<br><span id="completedCount">0</span></div>
        <div>⏰ Просрочено<br><span id="overdueCount">0</span></div>
    </div>

    <div class="date-filter">
        <button class="date-btn active" data-view="today">Сегодня</button>
        <button class="date-btn" data-view="tomorrow">Завтра</button>
        <button class="date-btn" data-view="week">Неделя</button>
        <button class="date-btn" data-view="all">Все</button>
        <button class="date-btn" data-view="archive">Архив</button>
    </div>

    <div class="category-bar" id="categoryBar">
        <div class="category-badge active" data-cat="work">💼 Работа</div>
        <div class="category-badge" data-cat="personal">🏠 Личное</div>
        <div class="category-badge" data-cat="study">📚 Учёба</div>
    </div>

    <div class="add-task-panel">
        <div class="row-inputs">
            <input type="text" id="taskTitle" placeholder="Название задачи" autocomplete="off">
            <select id="categorySelect">
                <option value="work">💼 Работа</option>
                <option value="personal">🏠 Личное</option>
                <option value="study">📚 Учёба</option>
            </select>
        </div>
        <div class="row-inputs">
            <select id="prioritySelect">
                <option value="low">🟢 Низкий</option>
                <option value="medium">🟡 Средний</option>
                <option value="high">🔴 Высокий</option>
            </select>
            <input type="datetime-local" id="deadlineInput">
        </div>
        <button id="addBtn">+ Добавить</button>
    </div>

    <div class="task-list" id="taskList">
        <div class="empty">✨ Нет задач в этом разделе</div>
    </div>

    <div class="version">
        Planifica v2.0
    </div>
</div>

<!-- Модалка настроек -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h2>⚙️ Настройки</h2>
        <h3>🎨 Цветовая тема</h3>
        <div class="theme-options">
            <div class="theme-option theme-teal-bg active" data-theme="teal"></div>
            <div class="theme-option theme-dark-bg" data-theme="dark"></div>
        </div>
        <button id="closeSettings" style="margin-top: 15px; background: #14b8a6; color: white; border: none; padding: 10px 20px; border-radius: 30px;">Закрыть</button>
    </div>
</div>

<!-- Модалка профиля -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <h2>👤 Профиль</h2>
        <div class="avatar-preview" id="avatarPreview">
            <span>😎</span>
        </div>
        <input type="file" id="avatarUpload" accept="image/*" style="margin-bottom: 15px;">
        <input type="text" id="userName" placeholder="Ваше имя" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 30px; border: 1px solid #ddd;">
        <select id="userGender" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 30px;">
            <option value="male">Мужской</option>
            <option value="female">Женский</option>
        </select>
        <textarea id="userGoal" rows="3" placeholder="Ваша цель..." style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 20px;"></textarea>
        <div class="profile-stats" style="margin: 15px 0;">
            <p>📈 Выполнено задач: <span id="profileCompleted">0</span></p>
        </div>
        <button id="saveProfile" style="background: #14b8a6; color: white; border: none; padding: 12px; border-radius: 30px; width: 100%;">💾 Сохранить</button>
        <button id="closeProfile" style="margin-top: 10px; background: #94a3b8; color: white; border: none; padding: 12px; border-radius: 30px; width: 100%;">Закрыть</button>
    </div>
</div>

<script>
(function() {
    let tasks = [];
    let currentView = 'today';
    let currentCategory = 'work';
    let userProfile = {
        name: '',
        avatarData: null, // base64 фото
        gender: 'male',
        goal: '',
        totalCompleted: 0
    };

    // Загрузка данных из localStorage
    function loadData() {
        const saved = localStorage.getItem('planifica_data');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                tasks = data.tasks || [];
                if (data.userProfile) {
                    userProfile = { ...userProfile, ...data.userProfile };
                }
                updateTotalCompleted();
            } catch(e) {}
        }
        // Тема
        const savedTheme = localStorage.getItem('planifica_theme');
        if (savedTheme === 'dark') {
            document.body.classList.remove('theme-teal');
            document.body.classList.add('theme-dark');
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('active');
                if (opt.dataset.theme === 'dark') opt.classList.add('active');
            });
        } else {
            document.body.classList.remove('theme-dark');
            document.body.classList.add('theme-teal');
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('active');
                if (opt.dataset.theme === 'teal') opt.classList.add('active');
            });
        }
        render();
    }

    function saveData() {
        const data = { tasks, userProfile };
        localStorage.setItem('planifica_data', JSON.stringify(data));
    }

    function updateTotalCompleted() {
        userProfile.totalCompleted = tasks.filter(t => t.completed).length;
    }

    function addTask(title, category, deadline, priority) {
        if (!title.trim()) return;
        const newTask = {
            id: Date.now(),
            title: title.trim(),
            category: category,
            deadline: deadline || null,
            priority: priority || 'medium',
            completed: false,
            createdAt: new Date().toISOString()
        };
        tasks.push(newTask);
        saveData();
        render();
    }

    function toggleComplete(id) {
        const task = tasks.find(t => t.id == id);
        if (task) {
            task.completed = !task.completed;
            updateTotalCompleted();
            saveData();
            render();
        }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id != id);
        updateTotalCompleted();
        saveData();
        render();
    }

    function editTask(id, newTitle, newCategory, newDeadline, newPriority) {
        const task = tasks.find(t => t.id == id);
        if (task) {
            if (newTitle && newTitle.trim()) task.title = newTitle.trim();
            if (newCategory) task.category = newCategory;
            if (newDeadline !== undefined) task.deadline = newDeadline;
            if (newPriority) task.priority = newPriority;
            saveData();
            render();
        }
    }

    // Фильтрация задач
    function getFilteredTasks() {
        let filtered = [...tasks];
        // по категории
        if (currentCategory !== 'all') {
            filtered = filtered.filter(t => t.category === currentCategory);
        }
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const tomorrowStart = new Date(todayStart);
        tomorrowStart.setDate(tomorrowStart.getDate() + 1);
        const weekEnd = new Date(todayStart);
        weekEnd.setDate(weekEnd.getDate() + 7);

        if (currentView === 'today') {
            filtered = filtered.filter(t => {
                if (!t.deadline) return false;
                const d = new Date(t.deadline);
                const deadlineDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                return deadlineDate.getTime() === todayStart.getTime();
            });
        } else if (currentView === 'tomorrow') {
            filtered = filtered.filter(t => {
                if (!t.deadline) return false;
                const d = new Date(t.deadline);
                const deadlineDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                return deadlineDate.getTime() === tomorrowStart.getTime();
            });
        } else if (currentView === 'week') {
            filtered = filtered.filter(t => {
                if (!t.deadline) return false;
                const d = new Date(t.deadline);
                const deadlineDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                return deadlineDate >= todayStart && deadlineDate < weekEnd;
            });
        } else if (currentView === 'archive') {
            filtered = filtered.filter(t => t.completed === true);
        } else { // all
            filtered = filtered.filter(t => !t.completed);
        }
        // сортировка по дедлайну
        filtered.sort((a,b) => {
            if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
            if (a.deadline) return -1;
            if (b.deadline) return 1;
            return 0;
        });
        return filtered;
    }

    function renderStats() {
        const all = tasks.length;
        const active = tasks.filter(t => !t.completed).length;
        const completed = tasks.filter(t => t.completed).length;
        const now = new Date();
        const overdue = tasks.filter(t => !t.completed && t.deadline && new Date(t.deadline) < now).length;
        document.getElementById('totalCount').innerText = all;
        document.getElementById('activeCount').innerText = active;
        document.getElementById('completedCount').innerText = completed;
        document.getElementById('overdueCount').innerText = overdue;
    }

    function renderTaskList() {
        const container = document.getElementById('taskList');
        const filtered = getFilteredTasks();
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty">✨ Нет задач в этом разделе</div>';
            return;
        }
        let html = '';
        filtered.forEach(task => {
            const isOverdue = !task.completed && task.deadline && new Date(task.deadline) < new Date();
            const priorityText = task.priority === 'high' ? '🔴 Высокий' : (task.priority === 'medium' ? '🟡 Средний' : '🟢 Низкий');
            const catIcon = task.category === 'work' ? '💼' : (task.category === 'personal' ? '🏠' : '📚');
            html += `
                <div class="task-item">
                    <div class="task-left">
                        <input type="checkbox" class="task-checkbox" data-id="${task.id}" ${task.completed ? 'checked' : ''}>
                        <span class="task-title ${task.completed ? 'task-completed' : ''}">${escapeHtml(task.title)}</span>
                        <span class="task-priority">${priorityText}</span>
                        <span class="category-badge" style="font-size:0.7rem;">${catIcon} ${task.category === 'work' ? 'Работа' : (task.category === 'personal' ? 'Личное' : 'Учёба')}</span>
                        ${task.deadline ? `<span style="font-size:0.7rem;">📅 ${new Date(task.deadline).toLocaleString()}</span>` : ''}
                        ${isOverdue ? '<span style="color:#f97316;">⚠️ Просрочено</span>' : ''}
                    </div>
                    <div class="task-right">
                        <button class="task-edit" data-id="${task.id}">✏️</button>
                        <button class="task-delete" data-id="${task.id}">🗑️</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        // события
        document.querySelectorAll('.task-checkbox').forEach(cb => {
            cb.addEventListener('change', (e) => toggleComplete(parseInt(e.target.dataset.id)));
        });
        document.querySelectorAll('.task-edit').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(e.currentTarget.dataset.id);
                const task = tasks.find(t => t.id === id);
                if (task) {
                    let newTitle = prompt('Новое название', task.title);
                    if (newTitle !== null) {
                        let newCat = prompt('Категория (work/personal/study)', task.category);
                        let newPriority = prompt('Приоритет (low/medium/high)', task.priority);
                        editTask(id, newTitle, newCat, task.deadline, newPriority);
                    }
                }
            });
        });
        document.querySelectorAll('.task-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (confirm('Удалить задачу?')) deleteTask(parseInt(e.currentTarget.dataset.id));
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }

    function renderHeader() {
        const avatarDiv = document.getElementById('headerAvatar');
        if (userProfile.avatarData) {
            avatarDiv.innerHTML = `<img src="${userProfile.avatarData}" alt="avatar">`;
        } else {
            avatarDiv.innerHTML = '😎';
        }
        document.getElementById('headerName').innerText = userProfile.name || 'Гость';
    }

    function renderProfileModal() {
        const preview = document.getElementById('avatarPreview');
        if (userProfile.avatarData) {
            preview.innerHTML = `<img src="${userProfile.avatarData}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            preview.innerHTML = '<span style="font-size:3rem;">😎</span>';
        }
        document.getElementById('userName').value = userProfile.name || '';
        document.getElementById('userGender').value = userProfile.gender || 'male';
        document.getElementById('userGoal').value = userProfile.goal || '';
        document.getElementById('profileCompleted').innerText = userProfile.totalCompleted;
    }

    function saveProfile() {
        userProfile.name = document.getElementById('userName').value;
        userProfile.gender = document.getElementById('userGender').value;
        userProfile.goal = document.getElementById('userGoal').value;
        saveData();
        renderHeader();
    }

    // Инициализация
    function init() {
        loadData();

        document.getElementById('addBtn').addEventListener('click', () => {
            const title = document.getElementById('taskTitle').value;
            const category = document.getElementById('categorySelect').value;
            const deadline = document.getElementById('deadlineInput').value;
            const priority = document.getElementById('prioritySelect').value;
            addTask(title, category, deadline, priority);
            document.getElementById('taskTitle').value = '';
            document.getElementById('deadlineInput').value = '';
        });

        document.querySelectorAll('.date-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentView = btn.dataset.view;
                render();
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.querySelectorAll('.category-badge').forEach(badge => {
            badge.addEventListener('click', () => {
                currentCategory = badge.dataset.cat;
                render();
                document.querySelectorAll('.category-badge').forEach(b => b.classList.remove('active'));
                badge.classList.add('active');
            });
        });

        // Настройки
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').addEventListener('click', () => settingsModal.style.display = 'flex');
        document.getElementById('closeSettings').addEventListener('click', () => settingsModal.style.display = 'none');

        document.querySelectorAll('.theme-option').forEach(opt => {
            opt.addEventListener('click', () => {
                const theme = opt.dataset.theme;
                if (theme === 'dark') {
                    document.body.classList.remove('theme-teal');
                    document.body.classList.add('theme-dark');
                    localStorage.setItem('planifica_theme', 'dark');
                } else {
                    document.body.classList.remove('theme-dark');
                    document.body.classList.add('theme-teal');
                    localStorage.setItem('planifica_theme', 'teal');
                }
                document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
            });
        });

        // Профиль
        const profileModal = document.getElementById('profileModal');
        document.getElementById('profileBtn').addEventListener('click', () => {
            renderProfileModal();
            profileModal.style.display = 'flex';
        });
        document.getElementById('closeProfile').addEventListener('click', () => profileModal.style.display = 'none');
        document.getElementById('saveProfile').addEventListener('click', () => {
            saveProfile();
            profileModal.style.display = 'none';
        });

        // Загрузка фото
        const avatarInput = document.getElementById('avatarUpload');
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    userProfile.avatarData = ev.target.result;
                    saveData();
                    renderProfileModal();
                    renderHeader();
                };
                reader.readAsDataURL(file);
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.style.display = 'none';
            if (e.target === profileModal) profileModal.style.display = 'none';
        });

        render();
    }

    function render() {
        renderStats();
        renderTaskList();
        renderHeader();
        // обновим активные фильтры
        document.querySelectorAll('.date-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === currentView);
        });
        document.querySelectorAll('.category-badge').forEach(badge => {
            badge.classList.toggle('active', badge.dataset.cat === currentCategory);
        });
    }

    init();
})();
</script>
</body>
</html>
